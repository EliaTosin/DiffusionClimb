[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ink_kin_stance"
version = "0.1.0"
description = "Diffusion-based trajectory generation for quadruped locomotion"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "zarr",
    "pin",
    "matplotlib",
    "tensorboard",
]

[project.optional-dependencies]
dev = ["optuna"]

[tool.setuptools.packages.find]
include = ["ink_kin_stance*"]
